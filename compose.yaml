services:
  ember:
    build: .
    image: ember-finance:0.1.0-rc.1
    init: true
    ports:
      - "${EMBER_BIND_ADDRESS:-127.0.0.1}:${EMBER_PORT:-3000}:3000"
    environment:
      FIREFLY_BASE_URL: ${FIREFLY_BASE_URL:?Set FIREFLY_BASE_URL in .env}
      FIREFLY_API_TOKEN: ${FIREFLY_API_TOKEN:?Set FIREFLY_API_TOKEN in .env}
      EMBER_APP_URL: ${EMBER_APP_URL:?Set the public HTTPS origin in .env}
      EMBER_AUTH_USERNAME: ${EMBER_AUTH_USERNAME:?Set EMBER_AUTH_USERNAME in .env}
      EMBER_AUTH_PASSWORD_HASH: ${EMBER_AUTH_PASSWORD_HASH:?Set a bcrypt password hash in .env}
      EMBER_AUTH_SECRET: ${EMBER_AUTH_SECRET:?Set a random session secret in .env}
    volumes:
      - ember-auth-state:/var/lib/ember-auth
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  ember-auth-state:
